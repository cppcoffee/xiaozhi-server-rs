# 小智 Rust Server —— 全云端最小配置（豆包）
# 浏览器改配置：http://<PC_IP>:8003/config

# 运行日志：同时写 stdout 和 logs/xiaozhi.log，按大小切片
[log]
level = "info" # trace/debug/info/warn/error；也可用 RUST_LOG 覆盖
dir = "logs" # 相对启动目录；不存在会自动创建
keep = 2 # 最多保留几个文件（当前 + .1 ...）
max_mb = 50 # 单文件上限

[server]
ws_port = 8000 # websocket 端口（设备连接）
http_port = 8003 # OTA 和配置页端口

# 拾音门控：环境噪声大调高 rms_threshold，说话识别不到调低
[vad]
rms_threshold = 500
start_frames = 2 # 连续多少帧有声音算开口（60ms/帧）
end_frames = 6 # 静音多少帧算说完（约 400ms）

[llm]
base_url = "https://ark.cn-beijing.volces.com/api/v3"
api_key = "你的doubao web key"
model = "doubao-seed-2-0-lite-260215"
prompt = """
你是一个名叫小智的智能助手，性格可爱、活泼、乐于助人。
回答要简短、口语化，控制在 60 字以内，不要使用 markdown、表情符号和括号注释。
用户是用语音和你交流的，所以避免使用列表、序号，不要复述用户的问题。
"""

# 豆包流式语音识别
[asr]
appid = "你的火山引擎语音识别服务appid"
access_token = "你的火山引擎语音识别服务access_token"
resource_id = "volc.seedasr.sauc.duration" # 并发版换 volc.seedasr.sauc.concurrent

# 豆包语音合成（整句 PCM）
[tts]
appid = "你的火山引擎语音合成服务appid"
access_token = "你的火山引擎语音合成服务access_token"
cluster = "volcano_tts"
voice = "zh_female_xiaohe_uranus_bigtts" # 必须是已购买的音色
