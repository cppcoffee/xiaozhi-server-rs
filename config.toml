# Xiaozhi Rust Server -- minimal all-cloud config (Doubao)
# Edit config in the browser: http://127.0.0.1:8000/config

# Runtime log: writes to stdout and logs/xiaozhi.log, rotated by size
[log]
level = "info" # trace/debug/info/warn/error; RUST_LOG overrides it
dir = "logs" # relative to the start directory; created if missing
keep = 2 # max files kept (current + .1 ...)
max_mb = 50 # max size per file

[server]
ws_port = 26003 # websocket port (device connections)
http_port = 8000 # OTA and config page port

# Capture gate: raise rms_threshold in noisy rooms, lower it when speech is missed
[vad]
rms_threshold = 500
start_frames = 2 # voiced frames needed to start speech (60ms/frame)
end_frames = 6 # silent frames that count as a pause (~360ms); a turn ends on device listen stop or the 20s cap

[llm]
base_url = "https://ark.cn-beijing.volces.com/api/v3"
api_key = "你的火山方舟 API Key"
model = "deepseek-v4-1-flash-economy-261017"
prompt = """
你是一个名叫小鹿的智能助手，性格可爱、活泼、乐于助人。
回答要简短、口语化，控制在 60 字以内，不要使用 markdown、表情符号和括号注释。
用户是用语音和你交流的，所以避免使用列表、序号，不要复述用户的问题。
"""

[speech]
# From the API management page of the Doubao speech project used by ASR and TTS.
api_key = "你的豆包语音 API Key"

# Doubao streaming speech recognition 2.0
[asr]
resource_id = "volc.seedasr.sauc.duration" # switch to volc.seedasr.sauc.concurrent for the concurrent edition

# Doubao speech synthesis V3 (Xiaohe 2.0)
[tts]
resource_id = "seed-tts-2.0"
voice = "zh_female_xiaohe_uranus_bigtts"
