[package]
name = "xiaozhi-server-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
flate2 = "1"
audiopus = "0.3.0-rc.0"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
html-escape = "0.2"
local-ip-address = "0.6"
bytes = "1"
libc = "0.2"
tokio-util = "0.7"
clap = { version = "4", features = ["derive"] }

# MCP protocol/lifecycle stays in the official Rust SDK; only XiaoZhi framing is local.
rmcp = { version = "=3.10.0", default-features = false, features = ["client"] }
eventsource-stream = "0.2.3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
