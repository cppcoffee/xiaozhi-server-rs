# Copy to config.local.toml, fill in your own model and credentials, then start.
[log]
level = "info"
dir = "logs"
keep = 2
max_mb = 50

[server]
ws_port = 26003
http_port = 8000

[vad]
rms_threshold = 500
start_frames = 2
end_frames = 6

[llm]
base_url = "https://ark.cn-beijing.volces.com/api/v3"
api_key = "你的方舟_API_Key"
model = "你的方舟模型_ID"
prompt = """
你是一个名叫小鹿的智能助手，性格可爱、活泼、乐于助人。
回答要简短、口语化，控制在 60 字以内，不要使用 markdown、表情符号和括号注释。
用户是用语音和你交流的，所以避免使用列表、序号，不要复述用户的问题。
"""

[speech]
# One API key from the same Doubao speech project serves ASR and TTS.
api_key = "你的豆包语音_API_Key"

[asr]
# Choose duration or concurrent based on the billing mode enabled for the project.
resource_id = "volc.seedasr.sauc.duration"

[tts]
resource_id = "seed-tts-2.0"
voice = "zh_female_xiaohe_uranus_bigtts"
